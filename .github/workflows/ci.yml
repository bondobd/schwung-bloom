name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - run: npm test
      - run: ./scripts/build.sh
